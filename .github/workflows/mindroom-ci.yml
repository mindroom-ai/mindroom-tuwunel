name: MindRoom CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mindroom-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free runner disk
        # The v2.0.0 debug test build and the release build together exceed the
        # runner's free disk ("No space left on device" in the release build).
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            clang \
            libclang-dev \
            libssl-dev \
            liburing-dev \
            pkg-config

      - name: Set up Rust
        run: rustup toolchain install

      - name: Set up nightly rustfmt
        # Upstream main f7dc0770b passes flake.lock's Fenix nightly rustfmt
        # (2026-11-20, rustfmt 1.12.0-nightly 6905905bb7 2026-11-19) unchanged.
        run: rustup toolchain install nightly-2026-11-20 --profile minimal --component rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo +nightly-2026-11-20 fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Build release binary
        run: cargo build --locked --release -p tuwunel
